name: Deploy Jupyter Book

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-book.yml"
      - "_config.yml"
      - "_config.outputs.yml"
      - "_toc.yml"
      - "CONTRIBUTING.md"
      - "Makefile"
      - "README.md"
      - "START_HERE.md"
      - "binder/**"
      - "chapters/**"
      - "content/**"
      - "img/**"
      - "intro.md"
      - "jupyter/**"
      - "myst.yml"
      - "notebooks/**"
      - "pyproject.toml"
      - "references.bib"
      - "references.md"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "uv.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-book.yml"
      - "_config.yml"
      - "_config.outputs.yml"
      - "_toc.yml"
      - "CONTRIBUTING.md"
      - "Makefile"
      - "README.md"
      - "START_HERE.md"
      - "binder/**"
      - "chapters/**"
      - "content/**"
      - "img/**"
      - "intro.md"
      - "jupyter/**"
      - "myst.yml"
      - "notebooks/**"
      - "pyproject.toml"
      - "references.bib"
      - "references.md"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "uv.lock"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build book
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate and build publication site
        run: make publish-check

      - name: Preserve Jupyter Book static assets on Pages
        run: touch _build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
