title: Quantitative Financial Mathematics with Python
author: Jesús Enrique Miranda Blanco
copyright: "2026"
logo: img/generated/fm-course-hero.png

only_build_toc_files: true

execute:
  execute_notebooks: "off"

bibtex_bibfiles:
  - references.bib

exclude_patterns:
  - README.md
  - .codex/**
  - .github/**
  - .venv/**
  - .uv-cache/**
  - .uv-python/**
  - .uv-tools/**
  - .data-cache/**
  - .jupyter-config/**
  - .pre-commit-cache/**
  - .pytest_cache/**
  - .ruff_cache/**
  - _build/**
  - .jupyter_cache/**
  - content/**
  - "**.ipynb_checkpoints"

repository:
  url: https://github.com/jesusmb230795/class_financial_mathematics
  branch: main
  path_to_book: ""

html:
  use_repository_button: true
  use_issues_button: true
  use_edit_page_button: true
  home_page_in_navbar: true

launch_buttons:
  notebook_interface: jupyterlab
  binderhub_url: https://mybinder.org

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - deflist
    - dollarmath
    - html_image
    - linkify
    - substitution

sphinx:
  config:
    language: en
    bibtex_reference_style: author_year
    html_static_path:
      - _static
    html_css_files:
      - custom.css
    togglebutton_selector: ".toggle, .admonition.dropdown, div.cell_input"
    togglebutton_hint: "Show code"
    togglebutton_hint_hide: "Hide code"
    html_theme_options:
      navigation_with_keys: true
