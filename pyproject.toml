[project]
name = "class-financial-mathematics"
version = "0.1.0"
description = "Jupyter Book for a quantitative financial mathematics course with Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aleatory",
    "arch>=6.0.0,<8.0.0",
    "fredapi>=0.5.0,<1.0.0",
    "ipywidgets>=8.0.0,<9.0.0",
    "jupyter-book>=1.0.0,<2.0.0",
    "jupyterlab>=4.0.0,<5.0.0",
    "jupytext>=1.16.0,<2.0.0",
    "matplotlib>=3.8.0,<4.0.0",
    "notebook>=7.0.0,<8.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pandas-datareader>=0.10.0,<1.0.0",
    "plotly>=5.0.0,<7.0.0",
    "pre-commit>=3.7.0,<5.0.0",
    "pyarrow>=15.0.0,<23.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "seaborn>=0.13.0,<1.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    "watermark",
    "yfinance>=0.2.0,<1.0.0",
]

[tool.uv]
package = false
