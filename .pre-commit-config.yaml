repos:
  - repo: local
    hooks:
      - id: clean-notebook-outputs
        name: Clean Jupyter notebook outputs
        entry: uv run python scripts/clean_notebook_outputs.py
        language: system
        files: ^notebooks/class/.*\.ipynb$
        pass_filenames: true

      - id: validate-notebooks
        name: Validate Jupyter and MyST notebooks
        entry: uv run python scripts/validate_notebooks.py
        language: system
        files: ^notebooks/class/.*\.(ipynb|md)$
        pass_filenames: true
